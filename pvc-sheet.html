<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PVC Card A4 Sheet – Front & Back</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#eef2f3;margin:0;padding:20px;text-align:center}
a{color:#0b5;font-weight:600;text-decoration:none}
.box{background:#fff;max-width:520px;margin:16px auto;padding:20px;border-radius:14px;box-shadow:0 8px 24px #0001;text-align:left}
input,button{width:100%;padding:11px;margin:6px 0;box-sizing:border-box;border-radius:8px;border:1px solid #ddd;font-size:14px}
button{background:#0b5;color:#fff;border:none;font-weight:700;cursor:pointer}
.sheet{width:210mm;height:297mm;background:#fff;margin:16px auto;box-shadow:0 8px 24px #0002;display:flex;flex-direction:column;align-items:center;padding-top:15mm;gap:8mm;box-sizing:border-box}
.c{width:85.6mm;height:53.98mm;border:.2mm dashed #999;border-radius:3mm;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.c img{width:100%;height:100%;object-fit:fill}
@media print{body{background:#fff;padding:0}.box,a,h1,p{display:none}.sheet{margin:0;box-shadow:none}@page{size:A4;margin:0}}
</style></head><body>
<a href="/">← Home</a>
<h1>PVC Card A4 Sheet</h1>
<p>Card ka front aur back upload karo — exact 85.60 × 53.98 mm size me A4 par print-ready.</p>
<div class="box">
 <b>Front side</b><input type="file" id="f" accept="image/*">
 <b>Back side</b><input type="file" id="b" accept="image/*">
 <button onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="sheet"><div class="c" id="cf">Front</div><div class="c" id="cb">Back</div></div>
<script>
['f','b'].forEach(k=>document.getElementById(k).onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const r=new FileReader();r.onload=x=>document.getElementById('c'+k).innerHTML='<img src="'+x.target.result+'">';r.readAsDataURL(file)});
</script></body></html>
